# Marg launchpad (marg.lol): static web app + image uploads
limit_req_zone $binary_remote_addr zone=tron_upload:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=tron_idx:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tron_tc:10m rate=3r/s;
# All visitors together: stays under the API key's own limit (the indexer and keeper share it).
limit_req_zone $server_name zone=tron_tc_all:1m rate=6r/s;
# Indexer API responses are cached briefly too (the service sends max-age=3).
proxy_cache_path /var/cache/nginx/marg_idx levels=1:2 keys_zone=marg_idx:10m max_size=100m inactive=5m use_temp_path=off;
# Toncenter proxy cache: identical reads from all visitors share one upstream call for a few seconds.
proxy_cache_path /var/cache/nginx/marg_tc levels=1:2 keys_zone=marg_tc:10m max_size=200m inactive=10m use_temp_path=off;
# Never cache (or merge) anything that broadcasts or simulates a transaction.
map "$http_origin|$http_sec_fetch_site" $marg_tc_allowed {
    default 0;
    "~^https://marg\.lol\|" 1;
    "|same-origin" 1;
}
map $request_body $marg_tc_nocache {
    default 0;
    ~*sendBoc 1;
    ~*estimateFee 1;
    ~*sendQuery 1;
}

# CSP for the Vite React app (TonConnect, Telegram Mini App, Google Fonts).
#  - script-src: own bundle + telegram-web-app.js (loaded by index.html).
#  - style-src 'unsafe-inline': TonConnect UI (goober) and lightweight-charts inject styles.
#  - connect-src https: wss:: toncenter, TonConnect bridges (SSE), wallet lists, IPFS gateways.
#  - frame-ancestors: Telegram Web (web.telegram.org) shows Mini Apps in an iframe, so 'none'
#    would break the Mini App there. For a strict site-only policy use 'none' and also enable
#    the X-Frame-Options DENY line below.
map $host $marg_csp {
    default "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https: wss:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org";
}

server {
    server_name marg.lol;
    server_tokens off;

    # add_header is NOT inherited by a location that has its own add_header, so every location
    # with add_header repeats the security set.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    limit_req_status 429;

    root /var/www/tron-web;
    location / {
        try_files $uri $uri/ /index.html;
        # The page itself must revalidate so a redeploy shows up at once (assets are hashed).
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $marg_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # add_header X-Frame-Options DENY always;   # only with frame-ancestors 'none' (breaks Telegram Web)
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # Wallets fetch this cross-origin
    location = /tonconnect-manifest.json {
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Toncenter for the browser: the server adds the API key (/etc/nginx/marg-toncenter-key.conf,
    # root-only, never in the web bundle) and caches reads for 4 s. Only the v2 JSON-RPC and v3 REST
    # APIs pass.
    # Only the calls the web app makes: v2 JSON-RPC and two v3 lookups.
    location ~ ^/toncenter/api/(v2/jsonRPC|v3/jetton/wallets|v3/nft/items)$ {
        # Only marg.lol pages may use it: browsers send Origin on POST and Sec-Fetch-Site on every
        # fetch, so a request with neither (curl, scripts) is refused. Best-effort; the rate limits
        # below are the real protection.
        if ($marg_tc_allowed = 0) { return 403; }
        limit_req zone=tron_tc burst=15 nodelay;
        limit_req zone=tron_tc_all burst=60;
        client_body_in_single_buffer on;
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        rewrite ^/toncenter/(.*)$ /$1 break;
        proxy_pass https://toncenter.com;
        proxy_ssl_server_name on;
        proxy_set_header Host toncenter.com;
        proxy_set_header Cookie "";
        include /etc/nginx/marg-toncenter-key.conf;
        proxy_cache marg_tc;
        proxy_cache_methods GET HEAD POST;
        proxy_cache_key "$request_method|$request_uri|$request_body";
        proxy_cache_valid 200 4s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 6s;
        proxy_cache_bypass $marg_tc_nocache;
        proxy_no_cache $marg_tc_nocache;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header X-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/idx/ {
        limit_req zone=tron_idx burst=30 nodelay;
        proxy_cache marg_idx;
        proxy_cache_valid 200 3s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_pass http://127.0.0.1:8811;
        proxy_set_header Host $host;
    }

    location = /api/upload {
        limit_req zone=tron_upload burst=5 nodelay;
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8810;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The upload service keys its per-IP daily cap on this (set here, never by the client).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering on;
    }

    # Uploaded images: content-addressed, never change
    location /u/ {
        alias /var/www/tron-uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Access-Control-Allow-Origin * always;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/marg.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marg.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


# www and the old nip.io address redirect to https://marg.lol (paths kept)
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.marg.lol;
    ssl_certificate /etc/letsencrypt/live/marg.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marg.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://marg.lol$request_uri;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name tron.168-119-180-71.nip.io;
    ssl_certificate /etc/letsencrypt/live/tron.168-119-180-71.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tron.168-119-180-71.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://marg.lol$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name marg.lol www.marg.lol tron.168-119-180-71.nip.io;
    return 301 https://marg.lol$request_uri;
}
